<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- 纯扁平圆角微标底板 (Flat Squircle) -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="#4f46e5" />
  
  <!-- 纯粹负空间代码标签 < / > -->
  <g stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左尖括号 < -->
    <path d="M48 40 L28 64 L48 88" />
    
    <!-- 闭合斜杠 / -->
    <path d="M71 36 L57 92" />
    
    <!-- 右尖括号 > -->
    <path d="M80 40 L100 64 L80 88" />
  </g>
</svg>
