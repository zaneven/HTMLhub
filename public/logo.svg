<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- 纯扁平圆角微标 (Flat Squircle) -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="72" height="72" rx="20" fill="#4f46e5" />
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 24 L16 36 L28 48" />
      <path d="M40 22 L32 50" />
      <path d="M44 24 L56 36 L44 48" />
    </g>
  </g>

  <!-- 品牌文字: HTMLhub (纯粹扁平排版) -->
  <g transform="translate(92, 0)">
    <!-- "HTML" 字样 -->
    <text
      x="0"
      y="50"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif"
      font-size="38"
      font-weight="900"
      letter-spacing="-1px"
      fill="#0f172a"
    >HTML</text>

    <!-- "hub" 字样 -->
    <text
      x="108"
      y="50"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif"
      font-size="38"
      font-weight="900"
      letter-spacing="-1px"
      fill="#4f46e5"
    >hub</text>

    <!-- 极简副标 -->
    <text
      x="2"
      y="66"
      font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Plus Jakarta Sans', Roboto, sans-serif"
      font-size="10"
      font-weight="700"
      letter-spacing="1.5px"
      fill="#64748b"
    >WORKSPACE</text>
  </g>
</svg>
