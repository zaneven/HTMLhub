<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于我们</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f8f9fa;
        line-height: 1.6;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #2c3e50;
        border-bottom: 3px solid #3498db;
        padding-bottom: 10px;
      }
      h2 {
        color: #34495e;
        margin-top: 30px;
      }
      .team {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 30px;
      }
      .member {
        text-align: center;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 8px;
      }
      .member img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #3498db;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>关于我们</h1>

      <p>
        我们是一个专注于创新技术解决方案的团队。自2020年成立以来，我们一直致力于为客户提供高质量的产品和服务。
      </p>

      <h2>我们的使命</h2>
      <p>
        通过技术创新，让世界变得更美好。我们相信技术的力量可以解决现实世界中的问题，提高人们的生活质量。
      </p>

      <h2>我们的团队</h2>
      <div class="team">
        <div class="member">
          <div
            style="
              width: 80px;
              height: 80px;
              border-radius: 50%;
              background: #3498db;
              margin: 0 auto 10px;
            "
          ></div>
          <h4>张三</h4>
          <p>首席技术官</p>
        </div>
        <div class="member">
          <div
            style="
              width: 80px;
              height: 80px;
              border-radius: 50%;
              background: #e74c3c;
              margin: 0 auto 10px;
            "
          ></div>
          <h4>李四</h4>
          <p>产品经理</p>
        </div>
        <div class="member">
          <div
            style="
              width: 80px;
              height: 80px;
              border-radius: 50%;
              background: #2ecc71;
              margin: 0 auto 10px;
            "
          ></div>
          <h4>王五</h4>
          <p>设计师</p>
        </div>
      </div>

      <h2>联系我们</h2>
      <p>如果您有任何问题或建议，请随时联系我们：</p>
      <ul>
        <li>邮箱: contact@example.com</li>
        <li>电话: +86 123-4567-8900</li>
        <li>地址: 北京市朝阳区某某街道123号</li>
      </ul>
    </div>
  </body>
</html>
